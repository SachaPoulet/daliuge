# Phase 0 corpus — invocation manifest.
#
# One case per (graph, preparation) pair. A "case" is everything needed to drive one
# logical graph through the translator reproducibly: which graph, how to turn it into an
# LG, and what is expected to come out the other side.
#
# Golden generation (#6) walks this file; nothing downstream should hard-code a graph path.
# Validate with: python3 tools/cases.py check
#
# Fields
#   id            filesystem-safe case name; golden outputs are named after it
#   graph         path under graphs/
#   prepare       "fill" (default) or "fill-config"
#   fill_params   -p arguments for `dlg fill`
#   graph_config  path under graphs/, required when prepare = "fill-config"
#   status        "ok" or "known-broken"
#   expect_drops  DROP count of the resulting PGT, excluding the trailing reprodata element
#   broken_stage  known-broken only: the CLI stage that raises
#   broken_error  known-broken only: the exception line, used to detect a change in failure
#   note          why this case exists, when that is not obvious

[defaults]
# `fill` is deprecated in the CLI help, but it is not optional here: feeding a raw .graph
# straight to `unroll` succeeds and leaves reprodata as `{}`, whereas fill/fill-config stamp
# it. Phase 1 #8 is specifically about that stamping, so every case goes through one of them.
prepare = "fill"
fill_params = []
reproducibility = "0"

# unroll options. Left at CLI defaults deliberately: `-z` zeroes sleep_time and `--app 1|2`
# overwrites every Application's dropclass, both of which erase translator output we want to
# regression-test. If a zerorun variant is wanted, add it as extra cases rather than changing
# these defaults.
oid_prefix = "1"
zerorun = false
app = 0

